[versions]
# Android toolchain
agp                 = "8.6.1"
# Kotlin 2.0.21 + AGP 8.6.1 is broken: KotlinAndroidTarget (Kotlin 2.0's new MPP-based
# Android target) references com.android.build.gradle.api.BaseVariant, which AGP 8.6
# removed. Kotlin 2.1.0 rewrote KotlinAndroidTarget and no longer references BaseVariant.
# KSP must be bumped in lockstep: 2.1.0-1.0.29 is the first KSP release for Kotlin 2.1.
kotlin              = "2.1.0"
ksp                 = "2.1.0-1.0.29"

# AndroidX
coreKtx             = "1.13.1"
lifecycleRuntimeKtx = "2.8.3"
activityCompose     = "1.9.0"
composeBom          = "2024.06.00"
animation           = "1.6.8"

# Coroutines (aligned with :brain-contract api dep)
coroutines          = "1.9.0"

# Room
room                = "2.6.1"

# Moshi
moshi               = "1.15.1"

# UI snapshot testing
paparazzi           = "1.3.5"

# Testing
junit               = "4.13.2"
truth               = "1.4.2"
mockitoKotlin       = "5.3.1"
androidxTestCore    = "1.6.1"
androidxTestRunner  = "1.6.1"
androidxTestExtJunit = "1.2.1"

[libraries]
# AndroidX
androidx-core-ktx                 = { group = "androidx.core",            name = "core-ktx",                      version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx    = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",         version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-compose",   version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose         = { group = "androidx.activity",        name = "activity-compose",              version.ref = "activityCompose" }
androidx-compose-bom              = { group = "androidx.compose",         name = "compose-bom",                   version.ref = "composeBom" }
androidx-ui                       = { group = "androidx.compose.ui",      name = "ui" }
androidx-ui-graphics              = { group = "androidx.compose.ui",      name = "ui-graphics" }
androidx-ui-tooling-preview       = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
androidx-ui-tooling               = { group = "androidx.compose.ui",      name = "ui-tooling" }
androidx-material3                = { group = "androidx.compose.material3", name = "material3" }
androidx-animation                = { group = "androidx.compose.animation", name = "animation",                   version.ref = "animation" }

# Test AndroidX
androidx-test-core                = { group = "androidx.test",            name = "core",                          version.ref = "androidxTestCore" }
androidx-test-runner              = { group = "androidx.test",            name = "runner",                        version.ref = "androidxTestRunner" }
androidx-test-ext-junit           = { group = "androidx.test.ext",        name = "junit",                         version.ref = "androidxTestExtJunit" }

# Coroutines
kotlinx-coroutines-android        = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",    version.ref = "coroutines" }

# Room
room-runtime                      = { group = "androidx.room",            name = "room-runtime",                  version.ref = "room" }
room-ktx                          = { group = "androidx.room",            name = "room-ktx",                      version.ref = "room" }
room-compiler                     = { group = "androidx.room",            name = "room-compiler",                 version.ref = "room" }

# Moshi
moshi-kotlin                      = { group = "com.squareup.moshi",       name = "moshi-kotlin",                  version.ref = "moshi" }
moshi-codegen                     = { group = "com.squareup.moshi",       name = "moshi-kotlin-codegen",          version.ref = "moshi" }

# Testing
junit                             = { group = "junit",                    name = "junit",                         version.ref = "junit" }
truth                             = { group = "com.google.truth",         name = "truth",                         version.ref = "truth" }
mockito-kotlin                    = { group = "org.mockito.kotlin",       name = "mockito-kotlin",                version.ref = "mockitoKotlin" }

[plugins]
android-application   = { id = "com.android.application",        version.ref = "agp" }
android-library       = { id = "com.android.library",            version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm",       version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                   = { id = "com.google.devtools.ksp",         version.ref = "ksp" }
paparazzi             = { id = "app.cash.paparazzi",              version.ref = "paparazzi" }
